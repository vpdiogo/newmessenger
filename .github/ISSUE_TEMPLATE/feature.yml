name: Feature
description: Propose a user-facing or system capability.
title: "feat: "
labels:
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome, not only an implementation idea. Immediately after creating
        the issue, apply exactly one selected `area:*`, workflow, and `priority:*` label.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What user or system outcome should exist?
      placeholder: A signed-in user can...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this matter now? Include relevant current behavior or constraints.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is included and explicitly excluded.
      placeholder: |
        Included:
        - ...

        Excluded:
        - ...
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that prove this issue is complete.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: dropdown
    id: primary-area
    attributes:
      label: Primary area
      description: Apply the matching `area:*` label after creating the issue.
      options:
        - frontend
        - backend
        - ux-ui
        - realtime
        - platform
        - documentation
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      description: Apply the matching workflow label after creating the issue.
      options:
        - interactive
        - needs-design
        - agent-ready
        - blocked
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Apply the matching `priority:*` label after creating the issue.
      options:
        - high
        - medium
        - low
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add links, risks, architectural decisions, or follow-up ideas.
