name: newmessenger

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-newmessenger}
  APP_DB_USER: ${APP_DB_USER:-newmessenger}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}

services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    environment:
      <<: *database-environment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/init-app.sql:/docker-entrypoint-initdb.d/01-app.sql:ro
    networks: [database]
    mem_limit: 1g
    cpus: 0.50
    logging: *logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1
          -U "$${APP_DB_USER}" -d "$${POSTGRES_DB}"
          -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api:
    image: ${API_IMAGE:?Set API_IMAGE}
    restart: unless-stopped
    environment:
      <<: *database-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      HTTP_WRITE_RATE_LIMIT_ENABLED: ${HTTP_WRITE_RATE_LIMIT_ENABLED:-false}
      WEBSOCKET_CONNECTION_LIMIT_ENABLED: ${WEBSOCKET_CONNECTION_LIMIT_ENABLED:-false}
    networks:
      database:
      proxy:
        aliases: [newmessenger-api]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    cpus: 0.75
    logging: *logging
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, infra/docker/healthcheck.mjs]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 15s

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}
    restart: unless-stopped
    networks:
      proxy:
        aliases: [newmessenger-web]
    mem_limit: 128m
    cpus: 0.25
    logging: *logging
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 4

  migrate:
    image: ${MIGRATION_IMAGE:?Set MIGRATION_IMAGE}
    profiles: [tools]
    environment: *database-environment
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.50
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
  database:
    internal: true

volumes:
  postgres-data:
