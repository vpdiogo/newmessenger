services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: newmessenger
      POSTGRES_USER: newmessenger
      POSTGRES_PASSWORD: newmessenger
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newmessenger -d newmessenger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
